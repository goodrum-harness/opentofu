schema_version: "1.3"

what: >
  Harden the OCI provider distribution path (`internal/getproviders/` + ORAS-Go
  integration) with robust error handling, complete authentication method coverage
  (token, basic auth, OIDC workload identity), structured fallback to standard
  registry mirrors on OCI fetch failure, and a documented configuration reference
  for `terraform.lock.hcl` OCI source blocks.

why: >
  OCI provider distribution was integrated in the v1.13.0-dev cycle but the
  implementation has no formal spec, no documented auth matrix, and no tested
  fallback behaviour when an OCI registry is unavailable. The OpenTofu community
  will adopt OCI distribution quickly post-release; gaps in auth coverage and
  silent failures will generate a high support burden and erode trust in the
  feature. Hardening before GA prevents a reactive patch cycle in v1.13.1.

requirements:
  must_have:
    - "OCI fetch errors surface a human-readable tfdiags.Diagnostic with the registry URL, the HTTP status or network error, and a suggested remediation step"
    - "Authentication supports: anonymous (public registries), static token (`TF_TOKEN_<hostname>`), HTTP basic auth, and OIDC workload identity (AWS IRSA / GCP Workload Identity / Azure Managed Identity)"
    - "When OCI fetch fails, the installer falls back to the configured filesystem mirror or registry mirror in the same priority order as non-OCI sources; fallback is logged at debug level"
    - "Lock file (`terraform.lock.hcl`) stores OCI digest alongside version; `tofu init` validates digest on re-init"
    - "Provider schema documentation includes an `oci_source` block reference with all supported auth attributes and examples"
    - "An integration test covers: successful install from OCI, auth failure returns clear diagnostic, network timeout triggers mirror fallback"

  nice_to_have:
    - "Support for OCI referrers API (attach SBOMs or attestations to provider artifacts)"
    - "`tofu providers` command shows OCI source URL and digest for OCI-sourced providers"
    - "Retry-with-backoff on transient OCI registry errors (429, 503)"

  out_of_scope:
    - "OCI distribution for modules (providers only in v1.13.0)"
    - "Building or publishing OCI provider images (tooling for provider authors)"
    - "OCI Content Trust / Notary v2 signature verification (future spec)"
    - "Changes to the gRPC provider protocol"

constraints:
  business:
    - "Must not change existing provider installation behaviour for non-OCI sources"
    - "OCI auth credentials must not be logged at any log level"
  compliance:
    - "OCI digest must be verified post-download before cache promotion (prevents TOCTOU on registry content)"
  ux:
    - "Auth configuration follows the same environment-variable convention already used for registry tokens (`TF_TOKEN_<hostname>`) — no new auth config file format"
    - "Error messages must include the OCI artifact reference (registry/repo:tag@digest) so users can reproduce the fetch manually"

success_criteria:
  acceptance:
    - "All three integration test scenarios (success, auth failure, fallback) pass in CI against a local OCI registry (e.g. registry.k8s.io or a local ORAS container)"
    - "Anonymous download of a public OCI-distributed provider completes with digest stored in lock file"
    - "Workload identity auth resolves without static credentials in an AWS EKS test environment"
    - "A provider sourced from OCI whose digest has changed since last `init` produces a clear diagnostic and non-zero exit code"
    - "Documentation page for `oci_source` block passes docs-lint in CI"
  metrics:
    - "Ratio of OCI-related GitHub issues post v1.13.0 release vs total provider-install issues (target < 15%)"
    - "Time-to-resolve for P1 OCI auth bugs (target < 72h with on-call rotation)"

context_links:
