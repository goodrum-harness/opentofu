cli_commands:
  core_workflow:
    - command: "tofu init"
      purpose: "Download modules, initialize backend, install providers, update lock file"
    - command: "tofu validate"
      purpose: "Validate HCL config (no network or state access)"
    - command: "tofu plan"
      purpose: "Produce a diff of planned changes; exit code 2 with -detailed-exitcode when changes present"
    - command: "tofu apply"
      purpose: "Execute a plan against real infrastructure"
    - command: "tofu destroy"
      purpose: "Destroy all managed resources (apply -destroy flag)"

  state_management:
    - "state list"
    - "state rm"
    - "state mv"
    - "state pull"
