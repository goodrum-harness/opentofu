# ─────────────────────────────────────────────────────────────────────────────
# EXECUTIVE SUMMARY
# ─────────────────────────────────────────────────────────────────────────────
executive_summary: |
  OpenTofu is an open-source infrastructure-as-code CLI tool (fork of Terraform)
  written entirely in Go. The v1.13.0-dev branch is an in-development release.
  The codebase is large (1,867 source files, 635 tests) and well-structured across
  five clear architectural layers: Config, Domain, Infrastructure, Application, and
  Presentation. Core execution is DAG-based and concurrent. All key subsystems
  (state management, provider plugins, encryption, backends) are behind stable
  Go interfaces, enabling independent testing and extension.

# ─────────────────────────────────────────────────────────────────────────────
# ARCHITECTURE OVERVIEW
# ─────────────────────────────────────────────────────────────────────────────
architecture:
  layers:
    - name: "Config"
      packages: ["version/", "internal/experiments/", "cmd/tofu/"]
      responsibility: >
        Binary entry point (cmd/tofu/main.go), version embedding (linker-injectable),
        and opt-in language experiment flags (all currently concluded/graduated).

    - name: "Domain"
      packages: ["internal/addrs/", "internal/configs/", "internal/plans/", "internal/states/"]
      responsibility: >
        Core data models: address types (all resource/module addressing), HCL config
        parsing, the planned-change representation, and the post-apply state tree.
        All types are immutable or explicitly sync-wrapped; no direct I/O.

    - name: "Infrastructure"
      packages:
        - "internal/backend/"
        - "internal/providers/"
        - "internal/getproviders/"
        - "internal/plugin/"
        - "internal/plugin6/"
        - "internal/providercache/"
        - "internal/encryption/"
      responsibility: >
        All external-system integration: remote state backends (S3, GCS, Azure, Consul,
        Kubernetes, PostgreSQL, HTTP, OSS, COS, in-memory), provider plugin gRPC
        protocols (v5 + v6), provider installation + lock-file management, and
        pluggable state/plan encryption (AES-GCM, AWS/GCP/Azure KMS, OpenBao, external subprocess).

    - name: "Application"
      packages: ["internal/tofu/", "internal/dag/", "internal/lang/", "internal/engine/"]
      responsibility: >
        The execution engine. Context is the central object — Plan(), Apply(), and
        Validate() all build a DAG and call graph.Walk() concurrently. Parallelism
        capped by semaphore (default 10). An experimental new engine is gated behind
        experimentalRuntimeEnabled().

    - name: "Presentation"
      packages: ["internal/command/", "internal/command/views/", "internal/command/arguments/"]
      responsibility: >
        CLI command implementations (~28 commands), argument parsing, and view
        rendering (Human/JSON/Multi output modes). Shared Meta struct carries
        all injected dependencies from main.

  execution_flow: |
    User runs `tofu <cmd>`
    └── cmd/tofu/main.go (realMain)
        └── command.Meta injected into *Command struct
            └── RunOperation → backend.Enhanced.Operation()
                └── backend/local.Local.opPlan / opApply
                    └── tofu.Context.Plan() / Apply()
                        └── BasicGraphBuilder builds DAG (25 transformer steps)
                            └── dag.AcyclicGraph.Walk() — concurrent node execution
                                └── GraphNodeExecutable.Execute(EvalContext)
                                    └── providers.Interface (gRPC via plugin/plugin6)

# ─────────────────────────────────────────────────────────────────────────────
# KEY SUBSYSTEMS
# ─────────────────────────────────────────────────────────────────────────────
key_subsystems:
  - name: "State Management"
    location: "internal/states/"
    summary: >
      Mutable post-apply infrastructure state. Protected by SyncState (RWMutex wrapper
      that deep-copies on every read). Persisted via statemgr.FilesystemBetweenPaths
      in the local backend. Three independent state copies kept during plan: State,
      RefreshState, PrevRunState.

  - name: "Plan Engine"
    location: "internal/plans/"
    summary: >
      Represents 'what will happen'. Dual-form pattern: decoded (cty.Value) and
      serialized (*Src JSON bytes) forms with explicit Encode/Decode converters.
      ChangesSync wraps the mutable changes container for concurrent graph-walk access.

  - name: "Provider Plugin System"
    location: "internal/plugin/, internal/plugin6/, internal/providers/"
    summary: >
      Providers run as subprocesses. Core communicates via gRPC (protocol v5 or v6).
      GRPCProvider implements providers.Interface on the core side. Supported protocol
      versions: >= 5, < 7. OCI artifact type for distribution: application/vnd.opentofu.provider.

  - name: "Provider Installation"
    location: "internal/getproviders/, internal/providercache/"
    summary: >
      Full install workflow: version query → package fetch → cache promotion → lock
      file update. Supports registry HTTP, filesystem mirrors, and OCI registries
      (via ORAS-Go). Per-operation flock files prevent concurrent install races.

  - name: "Encryption Subsystem"
    location: "internal/encryption/"
    summary: >
      Pluggable envelope encryption for state and plan files. Key providers: PBKDF2,
      AWS KMS, GCP KMS, Azure Key Vault, OpenBao, External subprocess. Methods:
      AES-GCM, External, Unencrypted (migration placeholder). Fallback chain enables
      in-place migration. Circular dependency detection via stack-based DFS.

  - name: "DAG Execution Engine"
    location: "internal/dag/"
    summary: >
      AcyclicGraph with cycle detection (Tarjan SCC), topological ordering, transitive
      reduction, and concurrent parallel walk. V*2 goroutines per walk; each vertex
      blocks on DepsCh until dependencies complete. Supports live graph mutation
      mid-walk via Walker.Update().

  - name: "HCL Configuration Parser"
    location: "internal/configs/"
    summary: >
      Parses .tf/.tofu/.tf.json into typed in-memory module trees. Static evaluation
      at load time resolves module sources, backend blocks, and provider for_each
      before the runtime walk (using only locals, const vars, path.*, terraform.workspace).
      Uses afero filesystem abstraction for testability.

