# ─────────────────────────────────────────────────────────────────────────────
# ARCHITECTURAL PATTERNS (for new contributors)
# ─────────────────────────────────────────────────────────────────────────────
architectural_patterns:
  - name: "Dual-form pattern"
    description: >
      Every change/state type has a decoded form (cty.Value) and a serialized form
      (*Src, JSON/Msgpack bytes) with explicit Encode/Decode converters.
      Applied in internal/plans, internal/states, and provider gRPC.

  - name: "SyncWrapper pattern"
    description: >
      Mutable shared data structures (State, Changes) expose a SyncState/ChangesSync
      wrapper adding RWMutex protection and deep-copy-on-read semantics.

  - name: "Transformer pipeline"
    description: >
      Graph construction via ~25 ordered GraphTransformer steps in BasicGraphBuilder.
      Each transformer is independently testable and modifies the graph in-place.

  - name: "Three-context graceful shutdown"
    description: >
      ctx (values only) → stopCtx (graceful stop) → cancelCtx (immediate abort).
      Applied throughout backend operations and the engine's Stop() method.

  - name: "Interface sealing via unexported sigil methods"
    description: >
      internal/addrs seals Referenceable, Targetable, InstanceKey etc. with
      unexported methods, preventing external implementations.

  - name: "Envelope encryption"
    description: >
      internal/encryption wraps any state/plan bytes in a JSON envelope containing
      ciphertext + key metadata. Key is never stored in plaintext.

  - name: "Factory function pattern"
    description: >
      Command factories, provider factories, and graph node factories are all lazy.
      Shared command.Meta is passed by value to all command structs.

  - name: "Address type system"
    description: >
      internal/addrs provides static/dynamic pair hierarchy: Module/ModuleInstance,
      ConfigResource/AbsResource. Generic addrs.Map[K,V] and addrs.Set[T] use the
      UniqueKeyer interface for non-comparable slice-typed keys.

  - name: "Hook system"
    description: >
      Observer/interceptor pattern for infrastructure lifecycle events. Any hook can
      return HookActionHalt for cooperative cancellation. Embed NilHook for no-ops.

# ─────────────────────────────────────────────────────────────────────────────
# CONVENTIONS
# ─────────────────────────────────────────────────────────────────────────────
conventions:
  naming:
    interfaces: "Named by capability, no I prefix (Backend, Provider, Encryption)"
    sync_wrappers: "'*Sync' suffix (ChangesSync, SyncState)"
    serialized_forms: "'*Src' suffix (ResourceInstanceChangeSrc)"
    graph_nodes_unexported: "'node*' prefix (nodeExpandModule)"
    graph_nodes_exported: "'Node*' prefix (NodeAbstractResource)"
    graph_transformers: "'*Transformer' suffix"
    commands: "'*Command' suffix in internal/command/"
    views: "'*Human/*JSON/*Multi' in internal/command/views/"
    backends: "internal/backend/remote-state/<name>/"

  testing:
    framework: "stdlib testing + go test"
    test_file_pattern: "*_test.go (co-located)"
    e2e_tests: "internal/command/e2etest/"
    equivalence_tests: "testing/equivalence-tests/"
    mock_generation: "go.uber.org/mock/mockgen"
    helpers: "BuildState(), BuildChanges(), OverrideForTesting()"
    provider_mocking: "testingOverrides struct in command.Meta"

  error_handling:
    primary: "tfdiags.Diagnostics — accumulating, not early-exit"
    hcl_layer: "hcl.Diagnostics, converted to tfdiags above"
    grpc_layer: "grpcErr() helper maps gRPC status → tfdiags"
    typed_errors: "ErrHostNoProviders, ErrProviderNotFound, ErrKeyProviderFailure, ErrCryptoFailure"

